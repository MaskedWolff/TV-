name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream
        run: git remote add upstream https://github.com/SSK4570live/TV-.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Merge Upstream
        run: |
          git fetch upstream
          
          # Get list of workflow files in our repo
          OUR_WORKFLOWS=$(git ls-files .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | sed 's|^\.github/workflows/||' | sort -u)
          
          # Get list of workflow files in upstream
          UPSTREAM_WORKFLOWS=$(git ls-tree -r upstream/main --name-only .github/workflows/ 2>/dev/null | sed 's|^\.github/workflows/||' | sort -u)
          
          # Find new workflow files (in upstream but not in ours)
          NEW_WORKFLOWS=$(comm -13 <(echo "$OUR_WORKFLOWS") <(echo "$UPSTREAM_WORKFLOWS"))
          
          # Stash our workflow files to preserve them
          if [ -n "$OUR_WORKFLOWS" ]; then
            git stash push -m "preserve-workflows" -- .github/workflows/
          fi
          
          # Merge upstream
          if ! git merge upstream/main --no-edit; then
            echo "Merge failed, resetting to upstream/main and force pushing..."
            git merge --abort
            git reset --hard upstream/main
            
            # Restore our workflow files
            if [ -n "$OUR_WORKFLOWS" ]; then
              git stash pop
            fi
            
            # Add new workflow files from upstream
            if [ -n "$NEW_WORKFLOWS" ]; then
              for wf in $NEW_WORKFLOWS; do
                git checkout upstream/main -- ".github/workflows/$wf"
              done
            fi
            
            git push origin HEAD:main --force
          else
            # Restore our workflow files after successful merge
            if [ -n "$OUR_WORKFLOWS" ]; then
              git stash pop
            fi
            
            # Add new workflow files from upstream
            if [ -n "$NEW_WORKFLOWS" ]; then
              for wf in $NEW_WORKFLOWS; do
                git checkout upstream/main -- ".github/workflows/$wf"
              done
              git commit -m "Add new workflow files from upstream"
            fi
            
            git push origin HEAD:main
          fi
