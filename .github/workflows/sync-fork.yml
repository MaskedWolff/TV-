name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream
        run: git remote add upstream https://github.com/SSK4570live/TV-.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Merge Upstream
        run: |
          if ! git merge upstream/main --no-edit; then
            echo "Merge failed, resetting to upstream/main and force pushing..."
            git merge --abort
            git reset --hard upstream/main
            git push https://${{ secrets.SYNC_TOKEN }}@github.com/yashiscool123/TV-.git HEAD:main --force
          else
            git push https://${{ secrets.SYNC_TOKEN }}@github.com/yashiscool123/TV-.git HEAD:main
          fi
